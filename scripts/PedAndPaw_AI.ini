; =============================================================
;
; PedAndPaw_AI – configuration
;
; Changes require a game restart unless otherwise noted.
; Comments start with a semicolon.
;
; =============================================================

; -------------------------------------------------------------
; General settings
; -------------------------------------------------------------
[General]
; Enable or disable the entire mod. Allowed values: true or false.
Enabled = true
; Language for system messages and subtitles. Allowed values: sv (Swedish) or en (English).
Language = sv
; Logging level. Allowed values: None, Error, Info, Debug.
LogLevel = Info
; Show in-game notification when a reply arrives. Boolean.
ShowNotifications = true

; -------------------------------------------------------------
; Key bindings
; -------------------------------------------------------------
[Keys]
; Key used to interact with the nearest NPC or animal, or to dismiss the NPC.
InteractKey = E
; Key used to send a text message to nearby civilians, police and emergency services.
TextMessageKey = T
; Key used to close the text input box without sending. Use standard key names (e.g., Escape).
CancelKey = Escape

; -------------------------------------------------------------
; Interaction parameters
; -------------------------------------------------------------
[Interaction]
; Maximum distance (in metres) at which the player can talk to an NPC or animal.
InteractionRange = 4.0
; Allow conversations with civilian NPCs. Boolean.
TalkToCivilians = true
; Allow conversations with police NPCs. Boolean.
TalkToPolice = true
; Allow conversations with emergency service NPCs. Boolean.
TalkToEmergency = true
; Allow conversations with animal NPCs. Boolean.
TalkToAnimals = true
; When a conversation starts, make the NPC turn to face the player. Boolean.
NpcFacePlayer = true

; -------------------------------------------------------------
; Context flags – what information is sent to the AI
; -------------------------------------------------------------
[Context]
; Include current time of day in the prompt. Boolean.
UseTimeOfDay = true
; Include current weather conditions in the prompt. Boolean.
UseWeather = true
; Include the name of the current area / zone in the prompt. Boolean.
UseArea = true
; Include whether the player is in a vehicle in the prompt. Boolean.
UseVehicle = true
; Include the player's weapon state (armed / unarmed) in the prompt. Boolean.
UseWeaponState = true
; Include whether the player is aiming in the prompt. Boolean.
UseAimingState = true
; Include the player's wanted level in the prompt. Boolean.
UseWantedLevel = true
; Include recent gunshots in the prompt. Boolean.
UseRecentGunshots = true
; Number of seconds after a gunshot that it is considered "recent".
GunshotMemorySeconds = 30

; -------------------------------------------------------------
; AI provider configuration
; -------------------------------------------------------------
[Ai]
; AI service provider. Allowed values: gemini, ollama, openrouter, groq, custom.
Provider = gemini
; Base URL for the provider's OpenAI-compatible chat completions endpoint.
BaseUrl = https://generativelanguage.googleapis.com/v1beta/openai/
; Model name used by the selected provider.
; gemini-3-flash-preview is the current working default; gemini-2.5-flash was retired by Google
; (it answers 404 for new keys).
Model = gemini-3-flash-preview
; Environment variable that holds the API key. Do NOT place the key here.
ApiKeyEnvVar = PEDANDPAW_AI_KEY
; HTTP request timeout in seconds.
RequestTimeoutSeconds = 15
; Sampling temperature (0.0–1.5) controlling response variability.
Temperature = 0.8
; Example for a local Ollama installation (no API key required):
; Provider = ollama
; BaseUrl = http://localhost:11434/v1

; -------------------------------------------------------------
; Limits and throttling
; -------------------------------------------------------------
[Limits]
; Maximum number of tokens the AI may generate per reply.
MaxTokensPerReply = 120
; Maximum number of characters shown in-game for a reply.
MaxReplyCharacters = 240
; Minimum seconds between two AI calls from the same NPC.
NpcCooldownSeconds = 8
; Maximum total AI calls per minute across all NPCs.
MaxRequestsPerMinute = 20
; Number of previous messages stored per NPC for context.
MemoryMessagesPerNpc = 6
; Maximum number of NPCs that can converse simultaneously.
MaxConcurrentConversations = 2
; Daily budget of AI calls before the mod stops making requests.
DailyRequestBudget = 500

; -------------------------------------------------------------
; Behaviour settings
; -------------------------------------------------------------
[Behavior]
; How often (in minutes) an NPC's mood is randomly re-rolled. 0 disables automatic changes.
ModeChangeIntervalMinutes = 15
; Allow game events (e.g., drawing a weapon) to influence the NPC's mood. Boolean.
DynamicModeSwitching = true
; Enable the attitude system that reacts to player actions. Boolean.
AttitudeSystem = true
; Starting trust level for NPCs (0–100).
DefaultTrust = 50
; If true, a character may admit in character, when the player asks, that it is a computer-controlled NPC. Boolean.
NpcSelfAwareness = true

; -------------------------------------------------------------
; Weapon interaction settings
; -------------------------------------------------------------
[Weapons]
; Enable NPC reactions to weapons being mentioned or used in dialogue. Boolean.
EnableWeaponReactions = true
; Allowed zones where the player may legally fire. Separate multiple zones with commas. Supported zones must be defined in ContextScanner.cs.
AllowShootingIn = ShootingRange, OwnPropertyOutsideCity
; If true, shooting is blocked when outside the allowed zones.
BlockFireOutsideAllowedZones = true
; NPCs react when the player fires illegally. Boolean.
ReactToIllegalFire = true

; -------------------------------------------------------------
; Animal settings
; -------------------------------------------------------------
[Animals]
; Whether animals can be shot. Boolean.
AnimalsCanBeShot = false
; Whether animals can be killed. Boolean.
AnimalsCanBeKilled = false
; Enable individual animal types. All booleans.
EnableRat = true
EnableDogs = true
EnableCat = true
EnableCrow = true
EnableSeagull = true
EnableMountainLion = true
EnableFishAndMarine = true
; How often (seconds) animals may ask for items or help.
AnimalQuestIntervalSeconds = 60

; -------------------------------------------------------------
; Vehicle borrowing settings
; -------------------------------------------------------------
[Vehicles]
; Allow NPCs to lend vehicles to the player. Boolean.
EnableVehicleBorrowing = true
; Minimum trust level (0–100) required for a vehicle loan.
MinTrustToLendVehicle = 65

; -------------------------------------------------------------
; Content filters
; -------------------------------------------------------------
[Content]
; Percentage (0–100) of nudity allowed in AI responses.
NudityPercent = 0

; -------------------------------------------------------------
; Role files configuration
; -------------------------------------------------------------
[Roles]
; Folder containing editable role text files (one file per role/animal).
RolesFolder = scripts/PedAndPaw_AI/roles
; Reload role files when the game starts. Boolean.
ReloadRolesOnStart = true